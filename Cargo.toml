[package]
name = "dirlisting"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Passive, runtime-independent parsing of HTTP directory listings"
license = "MIT"
repository = "https://github.com/rrepo-org/dirlisting"
readme = "README.md"
keywords = ["directory-listing", "autoindex", "parser", "http", "wasm"]
categories = ["parser-implementations", "web-programming"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
url = "2.5"
encoding_rs = "0.8"
serde_json = { version = "1", features = ["arbitrary_precision"] }
quick-xml = "0.38"
scraper = { version = "0.24", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
